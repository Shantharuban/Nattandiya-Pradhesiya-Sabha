<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Edit' if item else 'Create' }} News/Event</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 700px; margin: auto; }
        h1 { color: #0056b3; text-align: center; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="date"], textarea, select {
            padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; width: calc(100% - 22px);
        }
        textarea { resize: vertical; min-height: 100px; }
        .form-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        button[type="submit"] {
            background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 1em;
        }
        button[type="submit"]:hover { background-color: #218838; }
        a.cancel-button {
            background-color: #6c757d; color: white; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-size: 1em;
        }
        a.cancel-button:hover { background-color: #5a6268; }
        .flash-messages { list-style: none; padding: 0; margin-bottom: 15px; }
        .flash-messages li { padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        .flash-messages .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .flash-messages .danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .error-message { color: red; font-size: 0.9em; margin-top: -10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ 'Edit' if item else 'Create' }} News/Event</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flash-messages">
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form method="POST" action="">
            {{ form.hidden_tag() if form and form.hidden_tag }} <!-- For CSRF token if using Flask-WTF -->
            
            <div>
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" value="{{ item.title if item else '' }}" required>
            </div>
            
            <div>
                <label for="content">Content:</label>
                <textarea id="content" name="content" required>{{ item.content if item else '' }}</textarea>
            </div>
            
            <div>
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" value="{{ item.date.strftime('%Y-%m-%d') if item and item.date else '' }}" required>
            </div>
            
            <div>
                <label for="type">Type:</label>
                <select id="type" name="type" required>
                    <option value="news" {{ 'selected' if item and item.type == 'news' else '' }}>News</option>
                    <option value="event" {{ 'selected' if item and item.type == 'event' else '' }}>Event</option>
                </select>
            </div>
            
            <div>
                <label for="image_url">Image URL (Optional):</label>
                <input type="text" id="image_url" name="image_url" value="{{ item.image_url if item else '' }}">
            </div>
            
            <div>
                <label for="video_url">Video URL (Optional):</label>
                <input type="text" id="video_url" name="video_url" value="{{ item.video_url if item else '' }}">
            </div>
            
            <div class="form-actions">
                <button type="submit">{{ 'Update' if item else 'Create' }} Item</button>
                <a href="{{ url_for('news.list_news_events') }}" class="cancel-button">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
